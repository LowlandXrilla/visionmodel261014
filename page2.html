<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사다리타기 게임 | ENG-CALC PRO Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .btn-action { transition: all 0.15s ease; user-select: none; }
        .btn-action:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- Top Header (ENG-CALC PRO와 동일한 네비게이션 구조) -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 px-4 py-2.5">
        <div class="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Brand Title -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-stairs text-white text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-base sm:text-lg tracking-tight text-white">LADDER GAME <span class="text-amber-400 font-mono text-xs px-1.5 py-0.5 bg-amber-950 rounded border border-amber-800">PRO</span></h1>
                    </div>
                    <p class="text-[11px] text-slate-400 hidden sm:block">커피 내기 · 점심 메뉴 · 당번 정하기 인터랙티브 사다리타기</p>
                </div>
            </div>

            <!-- Navigation Tabs (메인 계산기 복귀 버튼 포함) -->
            <nav class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 overflow-x-auto max-w-full">
                <!-- 메인 공학용 계산기(index.html) 이동 탭 -->
                <a href="https://visionmodel261014-theta.vercel.app/" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-cyan-400 hover:bg-cyan-500/15 border border-transparent hover:border-cyan-500/30 shrink-0">
                    <i class="fa-solid fa-calculator"></i>
                    <span>← 공학용 계산기 (메인)</span>
                </a>

                <!-- Divider -->
                <div class="h-4 w-[1px] bg-slate-800 mx-1 shrink-0"></div>

                <!-- 현재 페이지 (사다리타기 게임) 활성 탭 -->
                <a href="https://visionmodel261014-theta.vercel.app/page2.html" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow shrink-0">
                    <i class="fa-solid fa-stairs"></i>
                    <span>사다리타기 게임</span>
                </a>
            </nav>

            <!-- Sound & Blind Mode Controls -->
            <div class="flex items-center gap-2">
                <button onclick="toggleBlindMode()" id="blind-btn" class="px-3 py-1.5 rounded-lg font-mono text-xs font-bold border transition-all bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700">
                    <i class="fa-solid fa-eye-slash mr-1"></i><span id="blind-text">블라인드 OFF</span>
                </button>
                <button onclick="toggleSound()" id="sound-btn" class="px-3 py-1.5 rounded-lg font-mono text-xs font-bold border transition-all bg-amber-500/10 text-amber-400 border-amber-500/30">
                    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-[1400px] w-full mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- Left/Center Ladder Game Area (9 cols) -->
        <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-4">
            
            <!-- Control Bar: Player Count & Presets -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                <!-- Player Count Controls -->
                <div class="flex items-center gap-3">
                    <span class="text-xs font-semibold text-slate-300"><i class="fa-solid fa-users text-amber-400 mr-1.5"></i>참가 인원</span>
                    <div class="flex items-center bg-slate-950 rounded-xl border border-slate-800 p-1">
                        <button onclick="changePlayerCount(-1)" class="btn-action w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold">-</button>
                        <span id="player-count-display" class="font-mono font-bold text-base text-amber-400 px-4">4명</span>
                        <button onclick="changePlayerCount(1)" class="btn-action w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold">+</button>
                    </div>
                </div>

                <!-- Theme Presets -->
                <div class="flex flex-wrap items-center gap-1.5">
                    <button onclick="applyPreset('coffee')" class="btn-action px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">☕ 커피 내기</button>
                    <button onclick="applyPreset('lunch')" class="btn-action px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">🍔 점심 메뉴</button>
                    <button onclick="applyPreset('order')" class="btn-action px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">🔢 발표 순서</button>
                    <button onclick="shuffleResults()" class="btn-action px-3 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-xs font-semibold text-amber-300 border border-amber-500/30">
                        <i class="fa-solid fa-shuffle mr-1"></i>결과 섞기
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-2">
                    <button onclick="generateNewLadder()" class="btn-action px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white border border-slate-700">
                        <i class="fa-solid fa-rotate mr-1"></i>사다리 재생성
                    </button>
                    <button onclick="startAllPlayers()" class="btn-action px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-xs sm:text-sm shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-play mr-1"></i>전체 출발
                    </button>
                </div>
            </div>

            <!-- Ladder Board Container -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 flex flex-col gap-3 overflow-x-auto">
                <div class="min-w-[540px] flex flex-col gap-2">
                    <!-- Top Player Inputs & Start Buttons -->
                    <div id="top-players-row" class="grid gap-2"></div>

                    <!-- Ladder Canvas Wrapper -->
                    <div class="relative h-[360px] bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden my-1">
                        <canvas id="ladder-canvas" class="w-full h-full block"></canvas>
                        <!-- Blind Mode Overlay -->
                        <div id="blind-overlay" class="hidden absolute inset-x-4 inset-y-8 bg-slate-900/95 backdrop-blur-md border border-amber-500/30 rounded-xl flex flex-col items-center justify-center z-10 pointer-events-none">
                            <i class="fa-solid fa-user-secret text-3xl text-amber-400 mb-2"></i>
                            <span class="font-bold text-sm text-white">블라인드 모드 활성화 중</span>
                            <span class="text-xs text-slate-400 mt-1">캐릭터를 클릭해 출발하면 경로가 공개됩니다!</span>
                        </div>
                    </div>

                    <!-- Bottom Prize/Penalty Inputs -->
                    <div id="bottom-results-row" class="grid gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Right Sidebar: Match Results & Share (3 cols) -->
        <aside class="lg:col-span-4 xl:col-span-3 flex flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col justify-between min-h-[420px]">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-trophy text-amber-400"></i> 사다리 매칭 결과표
                        </h2>
                        <span class="text-[11px] font-mono text-slate-400" id="completed-count">0 / 4 완료</span>
                    </div>
                    <div id="result-summary-list" class="space-y-2"></div>
                </div>

                <div class="pt-4 border-t border-slate-800 mt-4 flex flex-col gap-2">
                    <button onclick="revealAllInstant()" class="btn-action w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs border border-slate-700">
                        <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>애니메이션 없이 즉시 전체 결과 보기
                    </button>
                    <button onclick="copyResultText()" class="btn-action w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs shadow">
                        <i class="fa-regular fa-copy mr-1"></i>결과 텍스트 복사 (카톡/슬랙 공유)
                    </button>
                </div>
            </div>
        </aside>

    </main>

    <!-- Toast Notification -->
    <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-800 border border-amber-500/50 text-white text-xs font-mono shadow-2xl items-center gap-2">
        <i class="fa-solid fa-circle-check text-amber-400"></i>
        <span id="toast-msg">알림</span>
    </div>

    <script>
        const COLORS = ['#22d3ee', '#f59e0b', '#10b981', '#f43f5e', '#a855f7', '#3b82f6', '#ec4899', '#84cc16', '#eab308', '#14b8a6'];
        const AVATARS = ['🐶', '🐱', '🦊', '🐼', '🐯', '🦁', '🐸', '🐵', '🐧', '🦄'];

        const state = {
            count: 4,
            players: ['철수', '영희', '민수', '지수'],
            results: ['통과', '☕ 커피 쏘기!', '통과', '통과'],
            bridges: [],       // Array of { col, yRatio }
            completed: {},     // playerIdx -> { destCol, pathPoints }
            activeAnim: null,
            blindMode: false,
            soundOn: true
        };

        let audioCtx = null;
        function playTone(freq = 520, duration = 0.06) {
            if (!state.soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.value = 0.06;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-msg').textContent = msg;
            box.classList.remove('hidden');
            box.classList.add('flex');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                box.classList.add('hidden');
                box.classList.remove('flex');
            }, 2500);
        }

        function toggleBlindMode() {
            state.blindMode = !state.blindMode;
            const overlay = document.getElementById('blind-overlay');
            const text = document.getElementById('blind-text');
            if (state.blindMode) {
                overlay.classList.remove('hidden');
                text.textContent = '블라인드 ON';
            } else {
                overlay.classList.add('hidden');
                text.textContent = '블라인드 OFF';
            }
        }

        function toggleSound() {
            state.soundOn = !state.soundOn;
            document.getElementById('sound-icon').className = state.soundOn ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
            showToast(state.soundOn ? '효과음이 켜졌습니다.' : '효과음이 꺼졌습니다.');
        }

        function changePlayerCount(delta) {
            const next = state.count + delta;
            if (next < 2 || next > 10) return;
            state.count = next;
            while (state.players.length < next) state.players.push(`참가자${state.players.length + 1}`);
            while (state.results.length < next) state.results.push(state.results.length === 1 ? '당첨!' : '통과');
            document.getElementById('player-count-display').textContent = `${state.count}명`;
            generateNewLadder();
        }

        function applyPreset(type) {
            syncInputsFromDOM();
            if (type === 'coffee') {
                state.results = Array.from({ length: state.count }, (_, i) => i === 0 ? '☕ 커피 쏘기!' : '통과');
            } else if (type === 'lunch') {
                const menus = ['제육볶음', '돈까스', '마라탕', '국밥', '햄버거', '초밥', '김치찌개', '파스타', '쌀국수', '짜장면'];
                state.results = Array.from({ length: state.count }, (_, i) => menus[i % menus.length]);
            } else if (type === 'order') {
                state.results = Array.from({ length: state.count }, (_, i) => `${i + 1}번째 발표`);
            }
            shuffleResults();
        }

        function shuffleResults() {
            syncInputsFromDOM();
            const arr = state.results.slice(0, state.count);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            for (let i = 0; i < state.count; i++) state.results[i] = arr[i];
            renderPlayerAndResultInputs();
            renderSummaryBoard();
            showToast('결과 항목 순서를 무작위로 섞었습니다.');
        }

        function syncInputsFromDOM() {
            for (let i = 0; i < state.count; i++) {
                const pEl = document.getElementById(`player-input-${i}`);
                const rEl = document.getElementById(`result-input-${i}`);
                if (pEl) state.players[i] = pEl.value || `참가자${i + 1}`;
                if (rEl) state.results[i] = rEl.value || `결과${i + 1}`;
            }
        }

        function renderPlayerAndResultInputs() {
            const topRow = document.getElementById('top-players-row');
            const botRow = document.getElementById('bottom-results-row');
            topRow.style.gridTemplateColumns = `repeat(${state.count}, minmax(0, 1fr))`;
            botRow.style.gridTemplateColumns = `repeat(${state.count}, minmax(0, 1fr))`;
            topRow.innerHTML = '';
            botRow.innerHTML = '';

            for (let i = 0; i < state.count; i++) {
                const color = COLORS[i % COLORS.length];
                const avatar = AVATARS[i % AVATARS.length];

                const pCol = document.createElement('div');
                pCol.className = 'flex flex-col items-center gap-1.5';
                pCol.innerHTML = `
                    <button onclick="startSinglePlayer(${i})" class="btn-action w-11 h-11 rounded-2xl flex items-center justify-center text-xl shadow-md border-2 transition-transform hover:scale-105" style="background:${color}22; border-color:${color}" title="클릭하여 출발">
                        ${avatar}
                    </button>
                    <input id="player-input-${i}" type="text" value="${state.players[i] || `참가자${i+1}`}" oninput="syncInputsFromDOM(); renderSummaryBoard();"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-center font-semibold text-white focus:border-amber-400 focus:outline-none">
                `;
                topRow.appendChild(pCol);

                const isWinner = state.completed && Object.values(state.completed).some(c => c.destCol === i);
                const rCol = document.createElement('div');
                rCol.className = 'flex flex-col items-center';
                rCol.innerHTML = `
                    <input id="result-input-${i}" type="text" value="${state.results[i] || `결과${i+1}`}" oninput="syncInputsFromDOM(); renderSummaryBoard();"
                        class="w-full bg-slate-950 border ${isWinner ? 'border-amber-400 text-amber-300 font-bold' : 'border-slate-700 text-slate-200'} rounded-lg px-2 py-1.5 text-xs text-center focus:border-amber-400 focus:outline-none">
                `;
                botRow.appendChild(rCol);
            }
        }

        function generateNewLadder() {
            syncInputsFromDOM();
            state.completed = {};
            state.activeAnim = null;
            state.bridges = [];

            const rows = 9;
            for (let r = 1; r <= rows; r++) {
                const yRatio = r / (rows + 1);
                let col = 0;
                while (col < state.count - 1) {
                    if (Math.random() < 0.48) {
                        const jitter = (Math.random() - 0.5) * 0.03;
                        state.bridges.push({ col, yRatio: yRatio + jitter });
                        col += 2; // Prevent adjacent horizontal collision
                    } else {
                        col += 1;
                    }
                }
            }
            // Ensure at least one bridge per column gap
            for (let c = 0; c < state.count - 1; c++) {
                if (!state.bridges.some(b => b.col === c)) {
                    state.bridges.push({ col: c, yRatio: 0.25 + Math.random() * 0.5 });
                }
            }
            state.bridges.sort((a, b) => a.yRatio - b.yRatio);

            renderPlayerAndResultInputs();
            renderSummaryBoard();
            drawLadderCanvas();
        }

        function computePathForPlayer(startCol) {
            let curCol = startCol;
            let curY = 0;
            const points = [{ col: curCol, yRatio: 0 }];

            for (const b of state.bridges) {
                if (b.yRatio > curY) {
                    if (b.col === curCol) {
                        points.push({ col: curCol, yRatio: b.yRatio });
                        curCol += 1;
                        points.push({ col: curCol, yRatio: b.yRatio });
                        curY = b.yRatio;
                    } else if (b.col === curCol - 1) {
                        points.push({ col: curCol, yRatio: b.yRatio });
                        curCol -= 1;
                        points.push({ col: curCol, yRatio: b.yRatio });
                        curY = b.yRatio;
                    }
                }
            }
            points.push({ col: curCol, yRatio: 1 });
            return { destCol: curCol, points };
        }

        function getColX(col, width) {
            const cellW = width / state.count;
            return cellW * col + cellW / 2;
        }

        function drawLadderCanvas(animSegment = null) {
            const canvas = document.getElementById('ladder-canvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const padY = 18;
            const usableH = h - padY * 2;
            const toY = (yRatio) => padY + yRatio * usableH;

            ctx.clearRect(0, 0, w, h);

            // Vertical lines
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            for (let c = 0; c < state.count; c++) {
                const x = getColX(c, w);
                ctx.beginPath();
                ctx.moveTo(x, padY);
                ctx.lineTo(x, h - padY);
                ctx.stroke();
            }

            // Horizontal bridges
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            state.bridges.forEach(b => {
                const x1 = getColX(b.col, w);
                const x2 = getColX(b.col + 1, w);
                const y = toY(b.yRatio);
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
            });

            // Draw completed paths
            Object.keys(state.completed).forEach(pIdx => {
                const comp = state.completed[pIdx];
                const color = COLORS[pIdx % COLORS.length];
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.75;
                ctx.beginPath();
                comp.points.forEach((pt, idx) => {
                    const px = getColX(pt.col, w);
                    const py = toY(pt.yRatio);
                    if (idx === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.stroke();
                ctx.globalAlpha = 1;
            });

            // Active animated path
            if (animSegment) {
                const { playerIdx, drawnPoints, headX, headY } = animSegment;
                const color = COLORS[playerIdx % COLORS.length];
                ctx.strokeStyle = color;
                ctx.lineWidth = 5;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                drawnPoints.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.lineTo(headX, headY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Avatar head
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(AVATARS[playerIdx % AVATARS.length], headX, headY);
            }
        }

        function startSinglePlayer(playerIdx, onDone = null) {
            if (state.activeAnim) return;
            syncInputsFromDOM();
            if (state.blindMode) {
                document.getElementById('blind-overlay').classList.add('hidden');
            }

            const canvas = document.getElementById('ladder-canvas');
            const w = canvas.width;
            const h = canvas.height;
            const padY = 18;
            const usableH = h - padY * 2;
            const toY = (r) => padY + r * usableH;

            const { destCol, points } = computePathForPlayer(playerIdx);
            const pxPoints = points.map(p => ({ x: getColX(p.col, w), y: toY(p.yRatio) }));

            let segIdx = 0;
            let progress = 0;
            const speed = 0.14;
            state.activeAnim = true;

            function step() {
                if (segIdx >= pxPoints.length - 1) {
                    state.activeAnim = null;
                    state.completed[playerIdx] = { destCol, points };
                    playTone(780, 0.12);
                    drawLadderCanvas();
                    renderPlayerAndResultInputs();
                    renderSummaryBoard();
                    if (onDone) onDone();
                    return;
                }

                const p1 = pxPoints[segIdx];
                const p2 = pxPoints[segIdx + 1];
                progress += speed;
                if (progress >= 1) {
                    progress = 0;
                    segIdx++;
                    playTone(440 + segIdx * 35, 0.04);
                }

                const curP1 = pxPoints[Math.min(segIdx, pxPoints.length - 1)];
                const curP2 = pxPoints[Math.min(segIdx + 1, pxPoints.length - 1)];
                const headX = curP1.x + (curP2.x - curP1.x) * progress;
                const headY = curP1.y + (curP2.y - curP1.y) * progress;

                drawLadderCanvas({
                    playerIdx,
                    drawnPoints: pxPoints.slice(0, segIdx + 1),
                    headX,
                    headY
                });

                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function startAllPlayers() {
            if (state.activeAnim) return;
            let idx = 0;
            function next() {
                if (idx >= state.count) return;
                if (state.completed[idx]) {
                    idx++;
                    next();
                } else {
                    startSinglePlayer(idx, () => {
                        idx++;
                        setTimeout(next, 120);
                    });
                }
            }
            next();
        }

        function revealAllInstant() {
            syncInputsFromDOM();
            if (state.blindMode) document.getElementById('blind-overlay').classList.add('hidden');
            for (let i = 0; i < state.count; i++) {
                state.completed[i] = computePathForPlayer(i);
            }
            playTone(880, 0.15);
            drawLadderCanvas();
            renderPlayerAndResultInputs();
            renderSummaryBoard();
            showToast('전체 사다리 결과가 즉시 공개되었습니다.');
        }

        function renderSummaryBoard() {
            const list = document.getElementById('result-summary-list');
            list.innerHTML = '';
            let doneCount = 0;

            for (let i = 0; i < state.count; i++) {
                const pName = state.players[i] || `참가자${i + 1}`;
                const avatar = AVATARS[i % AVATARS.length];
                const color = COLORS[i % COLORS.length];
                const comp = state.completed[i];
                let resText = '대기 중...';
                let isDone = false;

                if (comp !== undefined) {
                    resText = state.results[comp.destCol] || `결과${comp.destCol + 1}`;
                    isDone = true;
                    doneCount++;
                }

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800';
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-base">${avatar}</span>
                        <span class="text-xs font-bold" style="color:${color}">${pName}</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-slate-600"></i>
                    <span class="font-mono text-xs font-bold ${isDone ? 'text-amber-400' : 'text-slate-500'}">${resText}</span>
                `;
                list.appendChild(item);
            }
            document.getElementById('completed-count').textContent = `${doneCount} / ${state.count} 완료`;
        }

        function copyResultText() {
            syncInputsFromDOM();
            const lines = ['[🪜 사다리타기 게임 결과]'];
            for (let i = 0; i < state.count; i++) {
                const pName = state.players[i] || `참가자${i + 1}`;
                const comp = state.completed[i] || computePathForPlayer(i);
                const rName = state.results[comp.destCol] || `결과${comp.destCol + 1}`;
                lines.push(`${AVATARS[i % AVATARS.length]} ${pName} ➔ ${rName}`);
            }
            const temp = document.createElement('textarea');
            temp.value = lines.join('\n');
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast('전체 결과 텍스트가 클립보드에 복사되었습니다!');
        }

        window.addEventListener('resize', () => drawLadderCanvas());
        window.onload = () => generateNewLadder();
    </script>
</body>
</html>
